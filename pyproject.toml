[project]
name = "alphagpt"
version = "0.1.0"
description = "AlphaGPT A-share daily factor mining with Tushare data"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "asyncpg>=0.28.0",
    "loguru>=0.7.0",
    "numpy>=1.24.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "plotly>=5.17.0",
    "psycopg2-binary>=2.9.10",
    "pyarrow>=12.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "streamlit>=1.28.0",
    "torch>=2.0.0",
    "tqdm>=4.66.0",
    "tushare>=1.2.89",
]

[project.optional-dependencies]
crypto-legacy = [
    "aiohttp>=3.9.0",
    "base58>=2.1.0",
    "solana>=0.30.0",
    "solders>=0.18.0",
]
research = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
